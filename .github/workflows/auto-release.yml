---
name: "auto-release"

# Creates a GitHub release whenever a tag starting with "v" is pushed
# (the nightly pipeline pushes one per day). Zenodo, once this repository is
# enabled at zenodo.org/account/settings/github, archives each release and
# mints a versioned DOI.
#
# Note: `permissions: contents: write` is required - repositories created
# after GitHub's 2023 default change give the workflow token read-only
# access, and release creation fails without it.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated daily release of the Mosquito Alert v2 sampling-effort dataset."
